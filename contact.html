  <!-- =========================================================================
       CONTAINER UTAMA: KONTAK (Modul 5: Layout 2 Kolom)
       ========================================================================= -->
  <main class="book-wrapper">

    <section class="journal-sheet">
      
      <span class="section-label">SALURAN KOMUNIKASI</span>
      <h1 class="section-title">KONTAK</h1>

      <div class="contact-minimal-grid">
        
        <!-- Kolom Kiri: Instagram & Gmail Sahaja -->
        <div class="contact-direct-box">
          
          <!-- Instagram -->
          <a href="https://instagram.com/syfrynnn" class="contact-entry-card" target="_blank" rel="noopener">
            <span class="contact-entry-label">Instagram</span>
            <span class="contact-entry-value">@syfrynnn</span>
          </a>

          <!-- Gmail -->
          <a href="mailto:asyifanurcahyakamila@gmail.com" class="contact-entry-card" target="_blank" rel="noopener">
            <span class="contact-entry-label">Gmail</span>
            <span class="contact-entry-value">asyifanurcahyakamila@gmail.com</span>
          </a>

        </div>

        <!-- Kolom Kanan: Formulir Pesan Minimalis (Modul 3: Forms) -->
        <div class="contact-form-wrapper">
          <form id="contactForm" novalidate>
            
            <div class="form-group">
              <label for="name" class="form-label">Nama Lengkap</label>
              <input type="text" id="name" name="name" class="form-input" placeholder="Nama Anda..." required>
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Alamat Email</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="email@domain.com..." required>
            </div>

            <div class="form-group">
              <label for="message" class="form-label">Pesan</label>
              <textarea id="message" name="message" class="form-textarea" placeholder="Tuliskan pesan Anda..." required></textarea>
            </div>

            <button type="submit" class="btn-editorial-submit">
              <span>Kirim Pesan</span>
            </button>

          </form>
        </div>

      </div>

      <!-- Nomor Halaman -->
      <div class="page-stamp">
        <span>Halaman</span>
        <span class="page-num">04</span>
      </div>
    </section>

  </main>
